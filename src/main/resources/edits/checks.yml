# Named checks. A rule uses one exactly like a built-in check: check: { type: ssnFormat }.
#
# Built in:  matches {regex} | oneOf {values} | min {value} | atMost {field} | minAge {years} | maxAge {years}
# Combine:   allOf {checks: [...]} | anyOf {checks: [...]} | not {check: ...}
# A named check can use built-in checks and named checks defined above it.
#
# Each check needs examples: values it must pass and fail when applied to 'field'. They are checked on every
# load and reload; a check that doesn't behave as its examples say is rejected, and the current one stays live.

# Examples are evaluated as if today were this date, so age examples never go stale.
examplesAsOf: 2026-11-01

checks:
  - name: ssnFormat
    description: Nine digits, either plain (123456789) or with dashes after the third and fifth digits (123-45-6789).
    check:
      type: anyOf
      checks:
        - { type: matches, regex: '\d{9}' }
        - { type: matches, regex: '\d{3}-\d{2}-\d{4}' }
    examples:
      field: studentInfo.ssn
      pass: ['123456789', '000000001', '123-45-6789']
      fail: ['12345678', '1234567890', '12345678a', ' 123456789', '',
             '12-345-6789', '1234-56-789', '123-456789', '12345-6789', '123--45-6789', '123 45 6789', '123-45-678']

  - name: nonNegative
    description: Zero or more.
    check: { type: min, value: 0 }
    examples:
      field: income.studentIncome
      pass: [0, 5000, 0.01]
      fail: [-1000, -0.01]

  - name: usStateOrTerritoryCode
    description: The 50 states, DC, and the territories FAFSA accepts, as two uppercase letters.
    check:
      type: oneOf
      values: [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO,
               MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY,
               DC, AS, FM, GU, MH, MP, PR, PW, VI]
    examples:
      field: stateOfResidence
      pass: [CA, DC, PR]
      fail: [XX, ca, CAL]
