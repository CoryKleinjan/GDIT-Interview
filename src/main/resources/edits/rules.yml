# FAFSA edit rules.
#
# Rules run, and are reported, top to bottom: order is priority. Every rule always runs, so an applicant
# sees every problem at once. This file, fields.yml and checks.yml can live outside the jar and be edited
# without a deployment.
#
#   id         stable identifier, reported in results
#   severity   ERROR (application INVALID) | WARNING (VALID_WITH_WARNINGS) | INFO (no effect on status)
#   enabled    optional, default true
#   message    shown when the rule fails: what is wrong and how to fix it
#   required   true: a missing (null or blank) value fails. false: a missing value passes
#   fields     field paths from fields.yml; every one must pass
#   check      optional test for present values: a built-in check, an allOf/anyOf/not combination,
#              or a named check from checks.yml
#   when       optional condition { field, equals }; when false the rule reports NOT_APPLICABLE
#   examples   the rule's tests: partial applications ({ field: value }) it must pass, fail, and (optionally)
#              not apply to. Every rule needs at least one pass and one fail example. They are checked on
#              every load and reload; a rule that does not behave as its examples say is rejected.

# Examples are evaluated as if today were this date, so age examples never go stale.
examplesAsOf: 2026-11-01

rules:
  # Marital and dependency status come first: they decide which later rules apply.
  - id: marital-status
    severity: ERROR
    message: Marital status is required (single or married).
    fields: [maritalStatus]
    required: true
    examples:
      pass: [ { maritalStatus: single }, { maritalStatus: married } ]
      fail: [ {} ]

  - id: dependency-status
    severity: ERROR
    message: Dependency status is required (dependent or independent).
    fields: [dependencyStatus]
    required: true
    examples:
      pass: [ { dependencyStatus: dependent }, { dependencyStatus: independent } ]
      fail: [ {} ]

  - id: student-name
    severity: ERROR
    message: Student first and last name are required and cannot be blank.
    fields: [studentInfo.firstName, studentInfo.lastName]
    required: true
    examples:
      pass: [ { studentInfo.firstName: Jane, studentInfo.lastName: Smith } ]
      fail:
        - {}
        - { studentInfo.lastName: Smith }
        - { studentInfo.firstName: Jane, studentInfo.lastName: '' }
        - { studentInfo.firstName: '   ', studentInfo.lastName: Smith }

  - id: student-age
    severity: ERROR
    message: Student must be at least 14 years old. Check that the date of birth is correct (YYYY-MM-DD).
    fields: [studentInfo.dateOfBirth]
    required: true
    check: { type: minAge, years: 14 }
    examples:
      pass: [ { studentInfo.dateOfBirth: 2012-11-01 }, { studentInfo.dateOfBirth: 2003-05-15 } ]  # 14 today; 23
      fail: [ { studentInfo.dateOfBirth: 2012-11-02 }, { studentInfo.dateOfBirth: 2027-01-01 }, {} ]  # 14 tomorrow; future; missing

  - id: ssn-format
    severity: ERROR
    message: SSN must be 9 digits, either 123456789 or 123-45-6789.
    fields: [studentInfo.ssn]
    required: true
    check: { type: ssnFormat }
    examples:
      pass: [ { studentInfo.ssn: '123456789' }, { studentInfo.ssn: '123-45-6789' } ]
      fail:
        - { studentInfo.ssn: '12345678' }
        - { studentInfo.ssn: '1234567890' }
        - { studentInfo.ssn: '12-345-6789' }
        - { studentInfo.ssn: '123-456789' }
        - { studentInfo.ssn: '12345678a' }
        - { studentInfo.ssn: ' 123456789' }
        - { studentInfo.ssn: '' }
        - {}

  - id: dependent-parent-income
    severity: ERROR
    message: Parent income is required for a dependent student. Enter 0 if parents had no income.
    fields: [income.parentIncome]
    required: true
    when: { field: dependencyStatus, equals: dependent }
    examples:
      pass: [ { dependencyStatus: dependent, income.parentIncome: 65000 }, { dependencyStatus: dependent, income.parentIncome: 0 } ]
      fail: [ { dependencyStatus: dependent } ]
      notApplicable: [ { dependencyStatus: independent }, {} ]

  - id: non-negative-income
    severity: ERROR
    message: Income cannot be negative. Enter 0 for no income or a loss.
    fields: [income.studentIncome, income.parentIncome]
    check: { type: nonNegative }
    examples:
      pass: [ { income.studentIncome: 5000, income.parentIncome: 65000 }, { income.studentIncome: 0 }, {} ]
      fail: [ { income.studentIncome: -1000 }, { income.studentIncome: 0, income.parentIncome: -0.01 } ]

  - id: married-spouse-info
    severity: ERROR
    message: Spouse first name, last name and SSN are required when marital status is married.
    fields: [spouseInfo.firstName, spouseInfo.lastName, spouseInfo.ssn]
    required: true
    when: { field: maritalStatus, equals: married }
    examples:
      pass: [ { maritalStatus: married, spouseInfo.firstName: John, spouseInfo.lastName: Smith, spouseInfo.ssn: '987654321' } ]
      fail:
        - { maritalStatus: married }
        - { maritalStatus: married, spouseInfo.firstName: John, spouseInfo.lastName: Smith }
        - { maritalStatus: married, spouseInfo.firstName: '  ', spouseInfo.lastName: Smith, spouseInfo.ssn: '987654321' }
      notApplicable: [ { maritalStatus: single }, {} ]

  # Household rules come after marital status, which decides who the household must include.
  - id: household-college-count
    severity: ERROR
    message: Number in household and number in college are required, and number in college cannot exceed number in household.
    fields: [household.numberInCollege, household.numberInHousehold]
    required: true
    check: { type: atMost, field: household.numberInHousehold }
    examples:
      pass: [ { household.numberInHousehold: 4, household.numberInCollege: 1 }, { household.numberInHousehold: 2, household.numberInCollege: 2 } ]
      fail:
        - { household.numberInHousehold: 2, household.numberInCollege: 5 }
        - { household.numberInCollege: 1 }
        - { household.numberInHousehold: 4 }

  - id: married-household-includes-spouse
    severity: ERROR
    message: A married student's household must include the student and spouse, so number in household must be at least 2.
    fields: [household.numberInHousehold]
    required: true
    check: { type: min, value: 2 }
    when: { field: maritalStatus, equals: married }
    examples:
      pass: [ { maritalStatus: married, household.numberInHousehold: 2 } ]
      fail: [ { maritalStatus: married, household.numberInHousehold: 1 }, { maritalStatus: married } ]
      notApplicable: [ { maritalStatus: single, household.numberInHousehold: 1 } ]

  - id: state-code
    severity: ERROR
    message: State of residence must be a two-letter uppercase US state, DC or territory code, for example CA.
    fields: [stateOfResidence]
    required: true
    check: { type: usStateOrTerritoryCode }
    examples:
      pass: [ { stateOfResidence: CA }, { stateOfResidence: DC }, { stateOfResidence: PR } ]
      fail: [ { stateOfResidence: XX }, { stateOfResidence: ca }, { stateOfResidence: CAL }, {} ]

  # Not one of the seven required edits: a non-blocking sanity check (a missing date is reported by student-age).
  - id: student-age-plausible
    severity: WARNING
    message: Student would be older than 120. Confirm the date of birth.
    fields: [studentInfo.dateOfBirth]
    check: { type: maxAge, years: 120 }
    examples:
      pass: [ { studentInfo.dateOfBirth: 1905-11-02 }, {} ]  # 120 today; missing is student-age's job
      fail: [ { studentInfo.dateOfBirth: 1905-11-01 } ]      # 121 today
