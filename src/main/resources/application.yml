spring:
  application:
    name: fafsa-edit-processor
  jackson:
    default-property-inclusion: non_null

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) logs for log aggregation. Remove this line for plain-text logs locally.
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

fafsa:
  edits:
    # The folder holding fields.yml, checks.yml and rules.yml. Point this at a folder outside the jar,
    # e.g. file:/etc/fafsa/edits/, to change fields, checks and rules without a deployment.
    config-location: classpath:edits/
    # How often to check the files for changes. A change goes live only if all three are valid together.
    reload-interval: 10s
    # Threads for batch validation. 0 = one per processor (validation is CPU-bound).
    batch-threads: 0
