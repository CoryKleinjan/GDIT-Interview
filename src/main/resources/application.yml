spring:
  application:
    name: fafsa-edit-processor
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    default-property-inclusion: non_null

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) logs for log aggregation. Remove this line for plain-text logs locally.
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

fafsa:
  edits:
    # The edit rules. Point this at a file outside the jar, e.g. file:/etc/fafsa/rules.yml,
    # to add, change or remove rules without a deployment.
    rules-location: classpath:rules.yml
    # How often to check the rule file for changes. A changed file goes live only if it is entirely valid.
    reload-interval: 10s
